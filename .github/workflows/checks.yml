name: Map Fox checks
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: npm test
      - name: Build standalone HTML
        run: npm run build
      - name: Check the built file exists
        run: test -s dist/Map_Fox_0.7.3_Standalone.html
      - name: Browser integration — import, native reroll, PNG, reopen
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8844 --bind 127.0.0.1 >/tmp/mapfox-server.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8844/index.html >/dev/null; then break; fi
            sleep 0.2
          done
          chrome=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          test -n "$chrome" || { echo "No browser available"; exit 1; }
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=65000 --dump-dom http://127.0.0.1:8844/tests/browser.integration.html >/tmp/mapfox-browser.html 2>/tmp/mapfox-chrome.log
          if ! grep -q '<pre id="result">PASS native import' /tmp/mapfox-browser.html; then
            grep -o '<pre id="result">[^<]*' /tmp/mapfox-browser.html || true
            tail -n 45 /tmp/mapfox-chrome.log || true
            exit 1
          fi
          grep -o '<pre id="result">[^<]*' /tmp/mapfox-browser.html
      - uses: actions/upload-artifact@v4
        with:
          name: Map_Fox_0.7.3_Standalone
          path: dist/Map_Fox_0.7.3_Standalone.html
