name: Map Fox checks
on:
  push:
  pull_request:
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regression tests
        run: npm test
      - name: Build standalone HTML
        run: npm run build
      - name: Check the built file exists
        run: test -s dist/Map_Fox_0.7.3_Standalone.html
      - uses: actions/upload-artifact@v4
        with:
          name: Map_Fox_0.7.3_Standalone
          path: dist/Map_Fox_0.7.3_Standalone.html
